name: Real authentication integration
on:
  pull_request:
    paths:
      - 'src/nifi_mcp/**'
      - 'tests/**'
      - 'examples/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'start-server.sh'
      - '.github/workflows/auth-integration.yml'
  push:
    branches: [main]
    paths:
      - 'src/nifi_mcp/**'
      - 'tests/**'
      - 'examples/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'start-server.sh'
      - '.github/workflows/auth-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked development dependencies
        run: |
          python -m pip install uv==0.9.18
          uv sync --frozen --extra dev
      - name: Unit and boundary checks
        run: |
          uv run --frozen pytest
          uv run --frozen ruff check src tests
      - name: Real TLS, identities, writes and denials
        run: uv run --frozen python tests/integration/run_auth.py all
      - name: Remove this test's resources
        if: always()
        run: uv run --frozen python tests/integration/run_auth.py cleanup
